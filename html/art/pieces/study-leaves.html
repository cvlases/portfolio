<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../css/art-piece.css">
    <title>Leaf Studies</title>
</head>
<body>
    <div class="art-piece">
        <section class="art-piece-hero">
            <p class="detail-label">// art</p>
            <h1>Leaf Studies</h1>
            <p class="piece-meta">Graphite · botanical observation</p>
            <p>Two exercises in close-looking — one anchored by the real specimen in the frame, one spread across a table as a set of structural drawings. Both are about the same thing: paying enough attention to understand.</p>
        </section>

        <figure class="art-piece-image">
            <img src="../../../assets/images/art_images/leaf.jpeg" alt="A real leaf placed over graphite studies on paper beside coffee and pencils">
            <figcaption class="piece-caption">Reference and rendering in the same frame — the drawing learning directly from the object.</figcaption>
        </figure>

        <figure class="art-piece-image">
            <img src="../../../assets/images/art_images/IMG_2377.jpeg" alt="Graphite drawings of leaves spread across a table">
            <figcaption class="piece-caption">Graphite studies where the texture of the leaf becomes the whole point.</figcaption>
        </figure>
    </div>
</body>
</html>
